[project]
name = "datproof-agent"
version = "0.1.0"
description = "MCP server: ask any AI assistant about a Bitcoin treasury company's SEC filings, with the filing attached."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.2,<2",
    "httpx>=0.27",
]

[project.scripts]
datproof-agent = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py", "ledger_client.py", "_formulas.py"]
