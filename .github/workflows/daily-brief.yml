name: DATproof daily brief

# SCHEDULE REMOVED 2026-08-22: the A-F scoreboard site this builds is superseded by the
# activity-grid site (see grid.yml). Kept for manual runs only; do not re-add the cron.
on:
  workflow_dispatch:
    inputs:
      brief:
        description: "Also generate the AI daily brief + LinkedIn draft (unreviewed prose naming public companies — a human must read it before it is used anywhere)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# Added 2026-08-09 after the 08-06 run failed with "Timeout reached, aborting! Current status:
# deployment_in_progress" — a second deployment was already running, so this one waited out its
# clock and died. The data commit had already landed, so the repo moved on and the SITE did not.
# One deploy at a time, and never cancel one halfway: a cancelled Pages deploy can leave the
# live site serving a half-published build.
concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install httpx anthropic

      # Gated 2026-07-30: the brief is unreviewed AI commentary about named public
      # companies. It no longer publishes on a schedule — only when a human ticks
      # the box on a manual run, and that human reads it before it goes anywhere.
      - name: Generate brief + LinkedIn draft (manual opt-in only)
        if: github.event_name == 'workflow_dispatch' && inputs.brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.DATPROOF_API_KEY }}
        run: python -m datproof brief --out briefs

      - name: Build public pages (tearsheet + landing)
        run: |
          python scripts/build_site.py
          python scripts/build_landing.py

      - name: Commit outputs
        run: |
          git config user.name "datproof-bot"
          git config user.email "actions@github.com"
          git add briefs/ site/ datproof/data/onchain_cache.json datproof/data/price_history.json
          git diff --cached --quiet || git commit -m "DATproof daily brief $(date -u +%F)"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          # Default is 10 minutes. The 08-06 failure burned that whole budget waiting behind
          # another deployment and then gave up. With the concurrency group above this should
          # not happen again; the longer clock is the second line of defence, because a slow
          # deploy is worth waiting for and a stale site is not.
          timeout: 1200000

      # A failed deploy used to end the run silently — the commit landed, the site did not, and
      # nothing said so until someone read the run log days later. Now the run says it out loud.
      - name: Say plainly that the site did not update
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "::error title=Site not updated::The data commit landed but the Pages deploy failed."
          echo "The repo and the live site now disagree. The next scheduled run will rebuild and"
          echo "redeploy from current main, so this usually heals itself within a day."
          echo "To fix it now instead: re-run this workflow."
